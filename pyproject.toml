[project]
name = "off-line-image-gen-mac"
version = "0.1.0"
description = "Offline AI image generation for Mac Silicon (MPS) — FLUX.2-klein, Z-Image Turbo, LTX-Video, LoRA support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "accelerate>=0.34.0",
    "transformers>=4.45.0",
    "sentencepiece",
    "protobuf",
    "safetensors",
    "huggingface-hub",
    "diffusers",
    "gradio>=6.0.0",
    "pillow>=10.0.0",
    "peft>=0.17.0",
    "scipy",
    "optimum-quanto>=0.2.7",
    "sdnq",
    "setuptools>=80.9.0",
    "kernels>=0.11.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.12",
    "aiofiles>=24.0",
    "spandrel>=0.4.0",
    "simple-lama-inpainting>=0.1.1",
    "requests>=2.32",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Depth Anything 3 (Depth Map accordion). Its own pyproject pulls xformers, open3d, pycolmap,
# evo, e3nn, moviepy and gsplat for 3D/video export, none of which the depth map needs
# (core/depth_map.py mocks those modules), so they are excluded below.
depth = [
    "depth-anything-3",
    "omegaconf",
    "addict",
]

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers.git", tag = "v0.40.0" }
sdnq = { git = "https://github.com/Disty0/sdnq.git" }
depth-anything-3 = { git = "https://github.com/ByteDance-Seed/Depth-Anything-3.git" }

[tool.uv]
default-groups = ["dev", "depth"]
exclude-dependencies = ["xformers", "open3d", "pycolmap", "evo", "e3nn", "moviepy", "pre-commit", "gsplat"]
